# Lint, then the full test matrix (Rust tests and the Bolt compatibility
# suites) on SQLite and on Postgres. scripts/test-matrix.sh does the work,
# so a failure here reproduces locally with the same command.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Type-checks the UI too; the server embeds its build.
      - name: Build the web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Only the postgres leg uses it (through EMU_TEST_POSTGRES).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: emu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EMU_TEST_POSTGRES: ${{ matrix.db == 'postgres' && 'postgres://postgres:emu@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.db }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            compat/js/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/test-matrix.sh ${{ matrix.db }}
